<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagnostik Kesiapan Scale Up</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel untuk menerjemahkan JSX di browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        * { -webkit-tap-highlight-color: transparent; }
        .fade-in { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .slide-up { animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* Custom scrollbar untuk form yang panjang */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #e5e5e5; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #d4d4d4; }
    </style>
</head>
<body class="bg-[#FAFAFA] text-neutral-900 font-sans antialiased min-h-screen flex flex-col selection:bg-orange-100 selection:text-orange-900">

    <div id="root" class="flex-grow flex flex-col relative w-full max-w-2xl mx-auto"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- GANTI URL DI BAWAH INI DENGAN URL GOOGLE APPS SCRIPT ANDA ---
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwmOGpC_I6KZXdkUCylywofs9Xr81Yo6BGAHTU3EP1zH5WQra5ggtOr1DPO1paVw3tIIw/exec";
        
        const Icons = {
            Check: ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M20 6 9 17l-5-5"/></svg>,
            ArrowRight: ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>,
            ArrowLeft: ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>,
            BarChart2: ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="18" x2="18" y1="20" y2="10"/><line x1="12" x2="12" y1="20" y2="4"/><line x1="6" x2="6" y1="20" y2="14"/></svg>,
            AlertCircle: ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>,
            RefreshCw: ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>,
            Briefcase: ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="20" height="14" x="2" y="7" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>,
            Settings: ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>,
            Users: ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>,
            DollarSign: ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="12" x2="12" y1="2" y2="22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>,
            User: ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>,
            Package: ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.29 7 12 12 20.71 7"/><line x1="12" y1="22" x2="12" y2="12"/></svg>,
            Loader: ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>,
            FileText: ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><line x1="10" x2="8" y1="9" y2="9"/></svg>
        };

        const questions = [
            // Market
            { id: 1, bidang: 'Market', aspek: 'Pemahaman Customer', pernyataan: 'Kami sudah memahami pain point utama customer secara mendalam berdasarkan data & feedback, bukan asumsi.' },
            { id: 2, bidang: 'Market', aspek: 'Positioning & Brand', pernyataan: 'Kami sudah memiliki positioning yang jelas serta dipahami dengan baik oleh customer.' },
            { id: 3, bidang: 'Market', aspek: 'Marketing', pernyataan: 'Kami sudah memiliki strategi marketing yang efektif untuk mendatangkan calon customer dan membuat brand kami semakin dikenal.' },
            { id: 4, bidang: 'Market', aspek: 'Sales & Pertumbuhan Revenue', pernyataan: 'Kami sudah memiliki metode mendatangkan customer dan penjualan kami masih terus bertumbuh.' },
            { id: 5, bidang: 'Market', aspek: 'Competitive Advantage', pernyataan: 'Kami sudah memiliki keunggulan kompetitif yang sulit ditiru dan cukup adaptif terhadap perubahan pasar.' },
            // Operation
            { id: 6, bidang: 'Operation', aspek: 'Proses & SOP', pernyataan: 'Kami sudah memiliki SOP yang jelas untuk proses kunci bisnis dan dijalankan secara konsisten.' },
            { id: 7, bidang: 'Operation', aspek: 'Quality Control', pernyataan: 'Kami sudah memiliki sistem QC yang mampu menjaga kualitas produk/layanan secara konsisten.' },
            { id: 8, bidang: 'Operation', aspek: 'Efisiensi Produksi/Supply Chain', pernyataan: 'Rantai pasok/produksi kami berjalan lancar tanpa sering terhambat.' },
            { id: 9, bidang: 'Operation', aspek: 'Teknologi & Sistem', pernyataan: 'Kami sudah memanfaatkan teknologi/sistem yang terintegrasi untuk mendukung efisiensi operasional.' },
            { id: 10, bidang: 'Operation', aspek: 'Risk Management & Business Continuity', pernyataan: 'Kami sudah memiliki identifikasi risiko utama beserta rencana mitigasi/business continuity yang memadai.' },
            // People
            { id: 11, bidang: 'People', aspek: 'Struktur Organisasi & Kejelasan Peran', pernyataan: 'Kami sudah memiliki struktur organisasi, job desc, dan reporting line yang jelas dan dipahami seluruh tim.' },
            { id: 12, bidang: 'People', aspek: 'Rekrutmen & Talent Acquisition', pernyataan: 'Kami sudah mampu merekrut talent berkualitas sesuai kebutuhan secara tepat waktu.' },
            { id: 13, bidang: 'People', aspek: 'Training & Development', pernyataan: 'Kami sudah memiliki program pengembangan skill karyawan yang berjalan rutin dan efektif.' },
            { id: 14, bidang: 'People', aspek: 'Culture & Engagement', pernyataan: 'Tingkat engagement dan motivasi karyawan kami tergolong sehat.' },
            { id: 15, bidang: 'People', aspek: 'Leadership & Succession Planning', pernyataan: 'Kami sudah memiliki leader lapis kedua yang siap mengambil keputusan tanpa bergantung penuh pada owner.' },
            // Finance
            { id: 16, bidang: 'Finance', aspek: 'Perencanaan & Budgeting', pernyataan: 'Kami sudah memiliki budget dan target keuangan yang jelas serta terpantau realisasinya.' },
            { id: 17, bidang: 'Finance', aspek: 'Cash Flow Management', pernyataan: 'Arus kas bisnis kami sehat, dengan buffer dana yang memadai untuk kondisi darurat.' },
            { id: 18, bidang: 'Finance', aspek: 'Financial Reporting & Control', pernyataan: 'Kami sudah memiliki laporan keuangan yang akurat, update, dan digunakan aktif untuk pengambilan keputusan.' },
            { id: 19, bidang: 'Finance', aspek: 'Profitabilitas & Cost Management', pernyataan: 'Kami sudah memahami margin profit per lini bisnis dan mengendalikan biaya secara efisien.' },
            { id: 20, bidang: 'Finance', aspek: 'Funding & Struktur Modal', pernyataan: 'Kami sudah memiliki sumber dana untuk membiayai ekspansi.' },
        ];

        const scoringOptions = [
            { score: 1, label: "Sangat Tidak Sesuai" },
            { score: 2, label: "Kurang Sesuai" },
            { score: 3, label: "Cukup Sesuai" },
            { score: 4, label: "Sesuai" },
            { score: 5, label: "Sangat Sesuai" },
        ];

        const categoryIcons = {
            Market: <Icons.Briefcase className="w-4 h-4 text-orange-500" />,
            Operation: <Icons.Settings className="w-4 h-4 text-orange-500" />,
            People: <Icons.Users className="w-4 h-4 text-orange-500" />,
            Finance: <Icons.DollarSign className="w-5 h-5 text-orange-500" />
        };

        function App() {
            // App states: 'identity', 'quiz', 'submitting', 'result'
            const [formState, setFormState] = useState('identity');
            const [identity, setIdentity] = useState({ nama: '', produk: '' });
            const [currentStep, setCurrentStep] = useState(0);
            const [answers, setAnswers] = useState({});
            const [animateKey, setAnimateKey] = useState(0);
            const [finalResult, setFinalResult] = useState(null);

            const totalQuestions = questions.length;
            const currentQ = questions[currentStep];
            const currentAnswer = answers[currentQ?.id];

            useEffect(() => {
                if (formState === 'quiz') {
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                    setAnimateKey(prev => prev + 1);
                }
            }, [currentStep, formState]);

            const handleIdentitySubmit = (e) => {
                e.preventDefault();
                if (identity.nama.trim() !== '' && identity.produk.trim() !== '') {
                    setFormState('quiz');
                }
            };

            const handleSelectScore = (score) => {
                setAnswers(prev => ({ ...prev, [currentQ.id]: score }));
                setTimeout(() => {
                    handleNext();
                }, 600);
            };

            const handleNext = () => {
                if (currentStep < totalQuestions - 1) {
                    setCurrentStep(prev => prev + 1);
                } else {
                    const isAllFilled = questions.every(q => answers[q.id] !== undefined);
                    if (isAllFilled) {
                        calculateAndSubmit();
                    }
                }
            };

            const handlePrev = () => {
                if (currentStep > 0) {
                    setCurrentStep(prev => prev - 1);
                }
            };

            const calculateAndSubmit = async () => {
                setFormState('submitting');
                
                // 1. Kalkulasi Kategori
                const categories = {
                    Market: { total: 0, count: 5 },
                    Operation: { total: 0, count: 5 },
                    People: { total: 0, count: 5 },
                    Finance: { total: 0, count: 5 }
                };

                Object.keys(answers).forEach(qId => {
                    const q = questions.find(qst => qst.id === parseInt(qId));
                    if (q) {
                        categories[q.bidang].total += answers[qId];
                    }
                });

                Object.keys(categories).forEach(cat => {
                    categories[cat].average = parseFloat((categories[cat].total / categories[cat].count).toFixed(1));
                });

                // 2. Evaluasi Status & Prioritas (Market Utama)
                const isReady = categories['Market'].average >= 4;
                const priorityOrder = ['Market', 'People', 'Operation', 'Finance'];
                const needsImprovement = priorityOrder.filter(cat => categories[cat].average < 4);
                const topPriority = needsImprovement.length > 0 ? needsImprovement[0] : null;

                const calculatedResult = { categories, isReady, needsImprovement, topPriority };
                setFinalResult(calculatedResult);

                // 3. Kirim ke Google Sheets
                if (GOOGLE_SCRIPT_URL !== "https://script.google.com/macros/s/AKfycbwmOGpC_I6KZXdkUCylywofs9Xr81Yo6BGAHTU3EP1zH5WQra5ggtOr1DPO1paVw3tIIw/exec") {
                    try {
                        const submitData = new FormData();
                        submitData.append('Nama_Leader', identity.nama);
                        submitData.append('Nama_Produk', identity.produk);
                        
                        // MENYIMPAN NILAI DARI PERTANYAAN 1-20
                        for (let i = 1; i <= 20; i++) {
                            submitData.append(`Q${i}`, answers[i] || 0);
                        }

                        // MENYIMPAN SKOR RATA-RATA
                        submitData.append('Skor_Market', categories['Market'].average);
                        submitData.append('Skor_Operation', categories['Operation'].average);
                        submitData.append('Skor_People', categories['People'].average);
                        submitData.append('Skor_Finance', categories['Finance'].average);

                        await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', body: submitData });
                    } catch (error) {
                        console.error('Error submitting data:', error);
                    }
                }
                
                // Lanjut ke halaman hasil (memberikan sedikit delay agar natural)
                setTimeout(() => {
                    setFormState('result');
                }, 1000);
            };

            const handleRestart = () => {
                setAnswers({});
                setCurrentStep(0);
                setFinalResult(null);
                setFormState('quiz');
            };

            // Halaman Awal Pengisian Identitas
            if (formState === 'identity') {
                return (
                    <div className="flex-grow flex items-center justify-center p-6 slide-up pb-20">
                        <div className="w-full">
                            <div className="mb-10 text-center">
                                <Icons.FileText className="w-12 h-12 mx-auto mb-4 text-orange-500 opacity-90" />
                                <h1 className="text-3xl font-light tracking-tight text-black mb-3">DIAGNOSTIK KESIAPAN SCALE UP</h1>
                                <p className="text-neutral-500 text-sm max-w-md mx-auto">Silakan isi data diri dan nama produk yang akan dinilai sebelum memulai asesmen.</p>
                            </div>

                            <form onSubmit={handleIdentitySubmit} className="space-y-6 bg-white p-8 sm:p-10 rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-neutral-100">
                                <div className="space-y-2">
                                    <label className="text-sm font-semibold text-neutral-700 flex items-center gap-2">
                                        <Icons.User className="w-4 h-4 text-orange-500"/> Nama Leader
                                    </label>
                                    <input 
                                        type="text" 
                                        required
                                        value={identity.nama}
                                        onChange={(e) => setIdentity({...identity, nama: e.target.value})}
                                        className="w-full px-4 py-3 rounded-xl border border-neutral-200 bg-neutral-50 focus:bg-white focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-100 transition-all text-black"
                                        placeholder="Masukkan nama lengkap Anda..."
                                    />
                                </div>
                                <div className="space-y-2">
                                    <label className="text-sm font-semibold text-neutral-700 flex items-center gap-2">
                                        <Icons.Package className="w-4 h-4 text-orange-500"/> Nama Produk
                                    </label>
                                    <input 
                                        type="text" 
                                        required
                                        value={identity.produk}
                                        onChange={(e) => setIdentity({...identity, produk: e.target.value})}
                                        className="w-full px-4 py-3 rounded-xl border border-neutral-200 bg-neutral-50 focus:bg-white focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-100 transition-all text-black"
                                        placeholder="Masukkan nama produk yang dinilai..."
                                    />
                                </div>
                                <div className="pt-4">
                                    <button 
                                        type="submit" 
                                        className="w-full flex items-center justify-center px-6 py-4 bg-black text-white font-bold rounded-xl hover:bg-neutral-800 transition-colors shadow-lg shadow-black/10"
                                    >
                                        Mulai Diagnostik <Icons.ArrowRight className="w-5 h-5 ml-2 text-orange-400" />
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                );
            }

            if (formState === 'submitting') {
                return (
                    <div className="flex-grow flex flex-col items-center justify-center p-6 fade-in">
                        <Icons.Loader className="w-10 h-10 text-orange-500 animate-spin mb-6" />
                        <h2 className="text-xl font-medium text-black mb-2">Menyimpan Hasil Asesmen...</h2>
                        <p className="text-neutral-500 text-sm">Mohon tunggu sebentar, kami sedang mengkalkulasi data Anda.</p>
                    </div>
                );
            }

            if (formState === 'result' && finalResult) {
                const { categories, isReady, needsImprovement, topPriority } = finalResult;
                
                return (
                    <div className="flex-grow flex items-center justify-center p-4 sm:p-8 slide-up pb-20">
                        <div className="w-full bg-white rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-neutral-100 overflow-hidden">
                            <div className="bg-black text-white p-10 text-center relative">
                                <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-orange-400 to-orange-600"></div>
                                <Icons.BarChart2 className="w-12 h-12 mx-auto mb-4 text-orange-500 opacity-90" />
                                <h1 className="text-2xl sm:text-3xl font-light tracking-tight mb-2">HASIL DIAGNOSTIK</h1>
                                <p className="text-neutral-400 text-sm">Hi <strong className="text-white">{identity.nama}</strong>, ini adalah analisis kesiapan produk <strong className="text-white">{identity.produk}</strong>.</p>
                            </div>

                            <div className="p-8 sm:p-10">
                                {/* 1. STATUS KESIAPAN (Syarat Mutlak: Market >= 4) */}
                                <div className={`mb-10 p-8 rounded-2xl border flex flex-col items-center text-center ${
                                    isReady ? 'bg-green-50 border-green-200' : 'bg-red-50 border-red-200'
                                }`}>
                                    <h2 className="text-xs font-bold tracking-widest uppercase text-neutral-500 mb-3">STATUS PRODUK</h2>
                                    <div className={`text-3xl sm:text-4xl font-bold uppercase tracking-tight mb-3 ${
                                        isReady ? 'text-green-600' : 'text-red-600'
                                    }`}>
                                        {isReady ? 'Produk Siap Scale Up' : 'Produk Belum Siap Scale Up'}
                                    </div>
                                    <p className="text-sm text-neutral-700 max-w-md">
                                        {isReady 
                                            ? 'Fundamental Market produk Anda telah memenuhi standar (Skor ≥ 4.0). Produk ini memiliki fondasi yang kuat untuk dieksekusi dalam strategi Scale Up.'
                                            : 'Fundamental Market produk Anda masih di bawah standar skor 4.0. Anda WAJIB memprioritaskan pembenahan Market produk ini sebelum melakukan ekspansi masif agar tidak menghamburkan sumber daya.'}
                                    </p>
                                </div>

                                {/* 2. PRIORITAS PERBAIKAN (< 4.0 dengan Hierarki Market -> People -> Operation -> Finance) */}
                                {topPriority ? (
                                    <div className="mb-10 bg-orange-50 border border-orange-100 p-6 rounded-2xl relative overflow-hidden">
                                        <div className="absolute left-0 top-0 bottom-0 w-1.5 bg-orange-500"></div>
                                        <div className="flex items-start">
                                            <Icons.AlertCircle className="w-6 h-6 text-orange-600 mr-4 flex-shrink-0 mt-0.5" />
                                            <div>
                                                <h3 className="text-lg font-semibold text-black mb-2">Prioritas Perbaikan Utama: <span className="uppercase text-orange-600">{topPriority}</span></h3>
                                                <p className="text-neutral-700 text-sm leading-relaxed mb-3">
                                                    Meskipun {isReady ? 'produk ini siap Scale Up' : 'produk ini belum siap Scale Up'}, terdapat kelemahan (*bottleneck*) yang terdeteksi. Berdasarkan hierarki prioritas (Market &rarr; People &rarr; Operation &rarr; Finance), area <strong className="text-black">{topPriority}</strong> harus menjadi <strong>fokus #1</strong> pembenahan Anda karena skor rata-ratanya masih di bawah standar 4.0 (Skor Anda: <strong>{categories[topPriority].average}</strong>).
                                                </p>
                                                {needsImprovement.length > 1 && (
                                                    <p className="text-xs text-neutral-500 font-medium pt-3 border-t border-orange-200/50">
                                                        Area lain yang juga mendapat nilai &lt; 4.0 dan menyusul untuk diperbaiki: <span className="text-neutral-800">{needsImprovement.filter(c => c !== topPriority).join(', ')}</span>.
                                                    </p>
                                                )}
                                            </div>
                                        </div>
                                    </div>
                                ) : (
                                    <div className="mb-10 bg-green-50 border border-green-100 p-6 rounded-2xl relative overflow-hidden">
                                        <div className="absolute left-0 top-0 bottom-0 w-1.5 bg-green-500"></div>
                                        <div className="flex items-start">
                                            <Icons.Check className="w-6 h-6 text-green-600 mr-4 flex-shrink-0 mt-0.5" />
                                            <div>
                                                <h3 className="text-lg font-semibold text-black mb-1">Semua Area Sangat Kuat</h3>
                                                <p className="text-neutral-700 text-sm leading-relaxed">
                                                    Luar biasa! Seluruh area fundamental bisnis Anda (Market, People, Operation, Finance) sudah memiliki skor ≥ 4.0. Tidak ada *bottleneck* mayor yang terdeteksi. Pertahankan kinerja luar biasa ini saat berekspansi!
                                                </p>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {/* 3. SKOR PER KATEGORI */}
                                <h4 className="text-xs font-bold uppercase tracking-wider text-neutral-400 mb-6">Detail Skor Per Kategori (Target: ≥ 4.0)</h4>
                                <div className="space-y-6">
                                    {Object.keys(categories).map((cat) => {
                                        const data = categories[cat];
                                        const percentage = (data.average / 5) * 100;
                                        const isNeedsImprovement = data.average < 4;
                                        
                                        return (
                                            <div key={cat} className="relative">
                                                <div className="flex justify-between mb-2">
                                                    <span className={`font-semibold flex items-center gap-2 ${cat === topPriority ? 'text-black' : 'text-neutral-600'}`}>
                                                        <span className={`p-1.5 rounded-md ${cat === topPriority ? 'bg-orange-100 text-orange-600' : 'bg-neutral-100 text-neutral-500'}`}>{categoryIcons[cat]}</span> 
                                                        {cat} {cat === topPriority && <span className="text-[10px] bg-orange-600 text-white px-2 py-0.5 rounded-full ml-1">Prioritas 1</span>}
                                                    </span>
                                                    <span className={`font-bold ${isNeedsImprovement ? 'text-orange-600' : 'text-green-600'}`}>
                                                        {data.average} <span className="text-xs font-normal text-neutral-400">/ 5.0</span>
                                                    </span>
                                                </div>
                                                <div className="h-2.5 w-full bg-neutral-100 rounded-full overflow-hidden">
                                                    <div 
                                                        className={`h-full rounded-full transition-all duration-1000 ease-out ${isNeedsImprovement ? 'bg-orange-500' : 'bg-green-500'}`}
                                                        style={{ width: `${percentage}%` }}
                                                    ></div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>

                                <div className="mt-12 text-center border-t border-neutral-100 pt-8">
                                    <button 
                                        onClick={handleRestart}
                                        className="inline-flex items-center px-6 py-3 text-sm font-medium rounded-full text-neutral-600 bg-neutral-100 hover:bg-neutral-200 transition-colors"
                                    >
                                        <Icons.RefreshCw className="w-4 h-4 mr-2" />
                                        Mulai Ulang Asesmen
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            const progressPercentage = ((currentStep) / totalQuestions) * 100;

            return (
                <div className="w-full flex-grow flex flex-col px-6 pb-20">
                    
                    {/* Header Sticky */}
                    <div className="w-full pt-6 pb-4 bg-[#FAFAFA]/90 backdrop-blur-md sticky top-0 z-10">
                        <div className="flex justify-between items-center mb-4">
                            <h2 className="text-xs font-bold tracking-widest uppercase text-neutral-400">DIAGNOSTIK KESIAPAN SCALE UP</h2>
                            <span className="text-[11px] font-bold px-3 py-1 bg-orange-100 text-orange-700 rounded-full">
                                {currentStep + 1} / {totalQuestions}
                            </span>
                        </div>
                        
                        <div className="h-1 w-full bg-neutral-200/60 rounded-full overflow-hidden">
                            <div 
                                className="h-full bg-orange-500 transition-all duration-500 ease-out"
                                style={{ width: `${progressPercentage}%` }}
                            ></div>
                        </div>
                    </div>

                    {/* Question Content */}
                    <div className="w-full flex-grow flex flex-col pt-8" key={animateKey}>
                        
                        <div className="mb-6 fade-in">
                            <span className="inline-flex items-center gap-2 text-xs font-bold uppercase tracking-wider text-orange-700 bg-orange-100 px-3 py-1.5 rounded-full">
                                {categoryIcons[currentQ.bidang]} {currentQ.bidang}
                            </span>
                            <span className="inline-block mt-2 sm:mt-0 sm:ml-3 text-sm text-neutral-500 font-medium">
                                &bull; {currentQ.aspek}
                            </span>
                        </div>
                        
                        <h3 className="text-2xl sm:text-4xl font-light text-black mb-10 sm:mb-12 leading-[1.3] tracking-tight fade-in">
                            "{currentQ.pernyataan}"
                        </h3>

                        {/* Interactive List Options (Seamless) */}
                        <div className="space-y-3 fade-in mt-auto">
                            {scoringOptions.map((option) => {
                                const isSelected = currentAnswer === option.score;
                                return (
                                    <button
                                        key={option.score}
                                        onClick={() => handleSelectScore(option.score)}
                                        className={`w-full group text-left px-5 py-4 rounded-2xl border-2 transition-all duration-200 flex items-center justify-between outline-none
                                            ${isSelected 
                                                ? 'bg-orange-50 border-orange-500 shadow-[0_4px_14px_0_rgba(249,115,22,0.15)]' 
                                                : 'bg-white border-transparent hover:border-orange-200 hover:bg-neutral-50 shadow-sm'
                                            }
                                        `}
                                    >
                                        <div className="flex items-center">
                                            <div className={`flex items-center justify-center w-8 h-8 rounded-full text-sm font-bold mr-4 transition-colors
                                                ${isSelected ? 'bg-orange-500 text-white' : 'bg-neutral-100 text-neutral-500 group-hover:bg-orange-100 group-hover:text-orange-600'}
                                            `}>
                                                {option.score}
                                            </div>
                                            <span className={`text-base font-medium transition-colors ${isSelected ? 'text-orange-900' : 'text-neutral-700 group-hover:text-black'}`}>
                                                {option.label}
                                            </span>
                                        </div>

                                        <div className={`transition-all duration-200 ${isSelected ? 'opacity-100 scale-100' : 'opacity-0 scale-50'}`}>
                                            <Icons.Check className="w-5 h-5 text-orange-500" />
                                        </div>
                                    </button>
                                );
                            })}
                        </div>
                    </div>

                    {/* Footer Navigation Back Button */}
                    <div className="w-full pt-8 fade-in flex">
                        <button
                            onClick={handlePrev}
                            disabled={currentStep === 0}
                            className={`flex items-center px-4 py-2 text-sm font-medium rounded-full transition-colors ${
                                currentStep === 0 
                                    ? 'text-neutral-300 cursor-not-allowed opacity-0' 
                                    : 'text-neutral-500 hover:bg-neutral-200 hover:text-black'
                            }`}
                        >
                            <Icons.ArrowLeft className="w-4 h-4 mr-2" />
                            Soal Sebelumnya
                        </button>
                    </div>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
